<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>歩いた土地マップ</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    h1 {
      text-align: center;
      margin: 15px 0 5px;
    }

    #info {
      text-align: center;
      margin-bottom: 10px;
      font-size: 16px;
    }

    #map {
      position: relative;
      width: 100%;
      height: 70vh;
      overflow: hidden;
    }

    /*
      下：カラーの本物の地図
    */
    #colorMap {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    /*
      上：モノクロの地図
    */
    #grayMap {
      position: absolute;
      inset: 0;
      z-index: 2;

      filter: grayscale(100%) brightness(0.9);

      /*
        最初は全面モノクロ。
        GPSで歩いた場所だけ透明にする。
      */
      mask-image: radial-gradient(
        circle at 50% 50%,
        transparent 0px,
        transparent 0px,
        black 1px
      );

      -webkit-mask-image: radial-gradient(
        circle at 50% 50%,
        transparent 0px,
        transparent 0px,
        black 1px
      );
    }

    .buttons {
      text-align: center;
      padding: 12px;
    }

    button {
      font-size: 16px;
      padding: 11px 18px;
      margin: 4px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #startBtn {
      background: #32a852;
      color: white;
    }

    #resetBtn {
      background: #777;
      color: white;
    }

    #status {
      text-align: center;
      font-size: 14px;
      color: #666;
      padding-bottom: 10px;
    }
  </style>
</head>

<body>

  <h1>歩いた土地マップ</h1>

  <div id="info">
    探索距離：
    <strong><span id="distance">0</span></strong> m
  </div>

  <div id="map">

    <!-- カラー地図 -->
    <div id="colorMap"></div>

    <!-- モノクロ地図 -->
    <div id="grayMap"></div>

  </div>

  <div class="buttons">

    <button id="startBtn">
      歩き始める
    </button>

    <button id="resetBtn">
      リセット
    </button>

  </div>

  <div id="status">
    「歩き始める」を押すと、歩いた場所がカラーになります。
  </div>


  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>

    // =====================================
    // カラー地図
    // =====================================

    const colorMap = L.map("colorMap", {
      zoomControl: false
    }).setView(
      [35.681236, 139.767125],
      15
    );


    // =====================================
    // モノクロ地図
    // =====================================

    const grayMap = L.map("grayMap", {
      zoomControl: false,
      attributionControl: false
    }).setView(
      [35.681236, 139.767125],
      15
    );


    // =====================================
    // OpenStreetMap
    // =====================================

    const tileUrl =
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png";


    L.tileLayer(tileUrl, {
      attribution:
        "&copy; OpenStreetMap contributors"
    }).addTo(colorMap);


    L.tileLayer(tileUrl).addTo(grayMap);


    // =====================================
    // 2つの地図を同期
    // =====================================

    let syncing = false;


    colorMap.on("move", function () {

      if (syncing) return;

      syncing = true;

      grayMap.setView(
        colorMap.getCenter(),
        colorMap.getZoom(),
        {
          animate: false
        }
      );

      syncing = false;

      updateExploredArea();

    });


    grayMap.on("move", function () {

      if (syncing) return;

      syncing = true;

      colorMap.setView(
        grayMap.getCenter(),
        grayMap.getZoom(),
        {
          animate: false
        }
      );

      syncing = false;

      updateExploredArea();

    });


    // =====================================
    // GPS
    // =====================================

    let watchId = null;

    let walking = false;

    let lastPosition = null;

    let totalDistance = 0;


    // 歩いた場所
    const exploredPoints = [];


    // =====================================
    // 距離計算
    // =====================================

    function calculateDistance(
      lat1,
      lon1,
      lat2,
      lon2
    ) {

      const R = 6371000;

      const rad = Math.PI / 180;

      const dLat =
        (lat2 - lat1) * rad;

      const dLon =
        (lon2 - lon1) * rad;

      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1 * rad) *
        Math.cos(lat2 * rad) *
        Math.sin(dLon / 2) ** 2;

      const c =
        2 *
        Math.atan2(
          Math.sqrt(a),
          Math.sqrt(1 - a)
        );

      return R * c;

    }


    // =====================================
    // 歩いた場所をカラーにする
    // =====================================

    function updateExploredArea() {

      if (
        exploredPoints.length === 0
      ) {

        grayMap.getContainer().style.maskImage =
          "none";

        grayMap.getContainer().style.webkitMaskImage =
          "none";

        return;

      }


      const mapElement =
        grayMap.getContainer();

      const rect =
        mapElement.getBoundingClientRect();


      const gradients =
        exploredPoints.map(
          point => {

            const pixel =
              grayMap.latLngToContainerPoint(
                [
                  point.lat,
                  point.lon
                ]
              );


            const x =
              (
                pixel.x /
                rect.width *
                100
              ).toFixed(2);


            const y =
              (
                pixel.y /
                rect.height *
                100
              ).toFixed(2);


            /*
              ここが「カラーになる範囲」

              35px → かなり狭い
              50px → 標準
              70px → 広め
            */

            return `
              radial-gradient(
                circle 55px at ${x}% ${y}%,
                transparent 0%,
                transparent 70%,
                black 100%
              )
            `;

          }
        );


      /*
        複数のGPS地点をつなげる
      */

      const mask =
        gradients.join(", ");


      grayMap.getContainer().style.maskImage =
        mask;

      grayMap.getContainer().style.webkitMaskImage =
        mask;

    }


    // =====================================
    // GPS成功
    // =====================================

    function success(position) {

      const lat =
        position.coords.latitude;

      const lon =
        position.coords.longitude;


      // 初回GPS
      if (!lastPosition) {

        lastPosition = {
          lat: lat,
          lon: lon
        };


        exploredPoints.push({
          lat: lat,
          lon: lon
        });


        colorMap.setView(
          [lat, lon],
          17
        );


        grayMap.setView(
          [lat, lon],
          17
        );


        updateExploredArea();

        document.getElementById(
          "status"
        ).textContent =
          "現在地を取得しました。歩いてみよう！";

        return;

      }


      // 前回地点からの距離
      const distance =
        calculateDistance(
          lastPosition.lat,
          lastPosition.lon,
          lat,
          lon
        );


      /*
        GPSが突然100m以上飛んだ場合は
        誤差として無視
      */

      if (distance > 100) {
        return;
      }


      /*
        3m以上移動したら記録
      */

      if (distance >= 3) {

        totalDistance += distance;


        document.getElementById(
          "distance"
        ).textContent =
          Math.round(
            totalDistance
          );


        lastPosition = {
          lat: lat,
          lon: lon
        };


        exploredPoints.push({
          lat: lat,
          lon: lon
        });


        updateExploredArea();


        document.getElementById(
          "status"
        ).textContent =
          "歩いた場所がカラーになっています。";

      }

    }


    // =====================================
    // GPSエラー
    // =====================================

    function error() {

      document.getElementById(
        "status"
      ).textContent =
        "GPSを取得できませんでした。位置情報の許可を確認してください。";

    }


    // =====================================
    // 歩き始める
    // =====================================

    document
      .getElementById("startBtn")
      .addEventListener(
        "click",
        function () {


          if (!walking) {

            if (
              !navigator.geolocation
            ) {

              alert(
                "このブラウザではGPSが使えません。"
              );

              return;

            }


            walking = true;


            this.textContent =
              "歩くのを停止";


            document.getElementById(
              "status"
            ).textContent =
              "GPSを取得中……";


            watchId =
              navigator.geolocation.watchPosition(
                success,
                error,
                {
                  enableHighAccuracy: true,
                  maximumAge: 3000,
                  timeout: 10000
                }
              );

          }


          else {

            walking = false;


            this.textContent =
              "歩き始める";


            if (
              watchId !== null
            ) {

              navigator.geolocation.clearWatch(
                watchId
              );

              watchId = null;

            }


            document.getElementById(
              "status"
            ).textContent =
              "記録を停止しました。";

          }

        }
      );


    // =====================================
    // リセット
    // =====================================

    document
      .getElementById("resetBtn")
      .addEventListener(
        "click",
        function () {


          if (
            watchId !== null
          ) {

            navigator.geolocation.clearWatch(
              watchId
            );

            watchId = null;

          }


          walking = false;


          document.getElementById(
            "startBtn"
          ).textContent =
            "歩き始める";


          lastPosition = null;


          totalDistance = 0;


          exploredPoints.length = 0;


          document.getElementById(
            "distance"
          ).textContent =
            "0";


          document.getElementById(
            "status"
          ).textContent =
            "リセットしました。";


          grayMap.getContainer().style.maskImage =
            "none";

          grayMap.getContainer().style.webkitMaskImage =
            "none";

        }
      );


    // =====================================
    // 初期状態
    // =====================================

    setTimeout(
      function () {

        colorMap.invalidateSize();

        grayMap.invalidateSize();

      },
      300
    );

  </script>

</body>
</html>
