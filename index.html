<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>歩いた土地を塗る</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #f4f6f4;
      color: #222;
    }

    .app {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #666;
      margin-top: 0;
    }

    #map {
      width: 100%;
      height: 500px;
      margin-top: 20px;
      border-radius: 18px;
      overflow: hidden;
      border: 2px solid #ddd;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 15px;
    }

    .stat {
      background: white;
      padding: 15px;
      border-radius: 14px;
      text-align: center;
      border: 1px solid #ddd;
    }

    .stat-title {
      color: #777;
      font-size: 13px;
    }

    .stat-value {
      font-size: 22px;
      font-weight: bold;
      margin-top: 5px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #2f8f4e;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #26783f;
    }

    button.reset {
      background: #777;
    }

    .status {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }

    .notice {
      background: white;
      padding: 15px;
      border-radius: 14px;
      margin-top: 15px;
      border: 1px solid #ddd;
      font-size: 14px;
      line-height: 1.6;
    }

    @media (max-width: 600px) {

      .app {
        padding: 12px;
      }

      #map {
        height: 450px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .buttons {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <h1>歩いた土地を、塗っていこう。</h1>

  <p class="subtitle">
    実際に歩いた道をGPSで記録します。
  </p>

  <div id="map"></div>

  <div class="stats">

    <div class="stat">
      <div class="stat-title">
        歩いた距離
      </div>

      <div class="stat-value">
        <span id="distance">0.00</span> km
      </div>
    </div>

    <div class="stat">
      <div class="stat-title">
        記録時間
      </div>

      <div class="stat-value">
        <span id="time">0</span> 分
      </div>
    </div>

    <div class="stat">
      <div class="stat-title">
        GPSポイント
      </div>

      <div class="stat-value">
        <span id="points">0</span>
      </div>
    </div>

  </div>

  <div class="buttons">

    <button id="startButton">
      ▶ 歩き始める
    </button>

    <button id="locationButton">
      📍 現在地へ
    </button>

    <button id="resetButton" class="reset">
      ↺ リセット
    </button>

  </div>

  <div class="status" id="status">
    停止中
  </div>

  <div class="notice">
    初めて使うときは、ブラウザから位置情報の使用許可を求められます。
    「許可」を選択してください。
  </div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

  /*
   * 地図
   */

  const map = L.map("map").setView(
    [35.681236, 139.767125],
    15
  );


  /*
   * OpenStreetMap
   */

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 19,

      attribution:
        "&copy; OpenStreetMap contributors"
    }
  ).addTo(map);


  /*
   * 歩いたルート
   */

  const routeLine = L.polyline(
    [],
    {
      color: "#2f8f4e",
      weight: 7,
      opacity: 0.85
    }
  ).addTo(map);


  /*
   * 現在地マーカー
   */

  let currentMarker = null;


  /*
   * GPS関連
   */

  let watchId = null;

  let walking = false;

  let route = [];

  let totalDistance = 0;

  let startTime = null;

  let timerId = null;


  /*
   * HTML要素
   */

  const startButton =
    document.getElementById("startButton");

  const locationButton =
    document.getElementById("locationButton");

  const resetButton =
    document.getElementById("resetButton");

  const distanceText =
    document.getElementById("distance");

  const timeText =
    document.getElementById("time");

  const pointsText =
    document.getElementById("points");

  const status =
    document.getElementById("status");


  /*
   * 2地点間の距離を計算
   *
   * GPSの緯度・経度から
   * メートル単位の距離を求める。
   */

  function calculateDistance(
    lat1,
    lon1,
    lat2,
    lon2
  ) {

    const R = 6371000;

    const rad =
      Math.PI / 180;

    const dLat =
      (lat2 - lat1) * rad;

    const dLon =
      (lon2 - lon1) * rad;

    const a =
      Math.sin(dLat / 2) *
      Math.sin(dLat / 2) +

      Math.cos(lat1 * rad) *
      Math.cos(lat2 * rad) *
      Math.sin(dLon / 2) *
      Math.sin(dLon / 2);

    const c =
      2 *
      Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1 - a)
      );

    return R * c;
  }


  /*
   * GPSから位置情報を受け取ったとき
   */

  function handlePosition(position) {

    const latitude =
      position.coords.latitude;

    const longitude =
      position.coords.longitude;


    const newPoint = [
      latitude,
      longitude
    ];


    /*
     * 前回の位置があれば
     * 距離を計算
     */

    if (route.length > 0) {

      const lastPoint =
        route[route.length - 1];

      const distance =
        calculateDistance(
          lastPoint[0],
          lastPoint[1],
          latitude,
          longitude
        );


      /*
       * GPSの誤差による
       * 異常なジャンプを無視
       *
       * 1回で100m以上移動した場合は
       * 今回は記録しない。
       */

      if (distance > 100) {

        return;

      }


      totalDistance += distance;

      distanceText.textContent =
        (totalDistance / 1000).toFixed(2);
    }


    /*
     * ルートに追加
     */

    route.push(newPoint);


    /*
     * 地図上の緑色の線を更新
     */

    routeLine.setLatLngs(route);


    /*
     * 現在地マーカー
     */

    if (currentMarker === null) {

      currentMarker =
        L.circleMarker(
          newPoint,
          {
            radius: 9,
            color: "#ffffff",
            weight: 3,
            fillColor: "#2f8f4e",
            fillOpacity: 1
          }
        ).addTo(map);

    } else {

      currentMarker.setLatLng(
        newPoint
      );

    }


    /*
     * 現在地へ移動
     */

    map.panTo(newPoint);


    /*
     * GPSポイント数
     */

    pointsText.textContent =
      route.length;


    status.textContent =
      "GPSで位置を記録中";
  }


  /*
   * GPSエラー
   */

  function handleError(error) {

    console.log(error);


    if (error.code === 1) {

      status.textContent =
        "位置情報の使用が許可されていません";

    } else if (error.code === 2) {

      status.textContent =
        "現在地を取得できません";

    } else if (error.code === 3) {

      status.textContent =
        "現在地の取得がタイムアウトしました";

    } else {

      status.textContent =
        "GPSでエラーが発生しました";

    }

  }


  /*
   * 記録時間
   */

  function updateTime() {

    if (!startTime) {
      return;
    }

    const elapsed =
      Date.now() - startTime;

    const minutes =
      Math.floor(
        elapsed / 60000
      );

    timeText.textContent =
      minutes;
  }


  /*
   * 歩き始める
   */

  startButton.addEventListener(
    "click",
    function() {

      if (walking) {

        /*
         * 一時停止
         */

        walking = false;

        if (watchId !== null) {

          navigator.geolocation.clearWatch(
            watchId
          );

          watchId = null;

        }

        clearInterval(timerId);

        startButton.textContent =
          "▶ 再開する";

        status.textContent =
          "一時停止中";

        return;
      }


      /*
       * GPSが利用できるか確認
       */

      if (!navigator.geolocation) {

        status.textContent =
          "このブラウザではGPSを利用できません";

        return;

      }


      /*
       * 記録開始
       */

      walking = true;

      startButton.textContent =
        "Ⅱ 一時停止";

      status.textContent =
        "GPSを取得しています…";


      if (!startTime) {

        startTime =
          Date.now();

      }


      /*
       * GPSの監視開始
       */

      watchId =
        navigator.geolocation.watchPosition(

          handlePosition,

          handleError,

          {
            enableHighAccuracy: true,

            maximumAge: 3000,

            timeout: 10000
          }

        );


      /*
       * 時間表示
       */

      timerId =
        setInterval(
          updateTime,
          1000
        );

    }
  );


  /*
   * 現在地へ移動
   */

  locationButton.addEventListener(
    "click",
    function() {

      if (!navigator.geolocation) {

        status.textContent =
          "GPSを利用できません";

        return;

      }


      status.textContent =
        "現在地を取得しています…";


      navigator.geolocation.getCurrentPosition(

        function(position) {

          const point = [

            position.coords.latitude,

            position.coords.longitude

          ];


          map.setView(
            point,
            17
          );


          if (currentMarker === null) {

            currentMarker =
              L.circleMarker(
                point,
                {
                  radius: 9,

                  color: "#ffffff",

                  weight: 3,

                  fillColor: "#26783f",

                  fillOpacity: 1
                }
              ).addTo(map);

          } else {

            currentMarker.setLatLng(
              point
            );

          }


          status.textContent =
            "現在地を表示しました";

        },

        handleError,

        {
          enableHighAccuracy: true,

          timeout: 10000,

          maximumAge: 0
        }

      );

    }
  );


  /*
   * リセット
   */

  resetButton.addEventListener(
    "click",
    function() {

      if (watchId !== null) {

        navigator.geolocation.clearWatch(
          watchId
        );

      }

      clearInterval(timerId);


      walking = false;

      watchId = null;

      route = [];

      totalDistance = 0;

      startTime = null;


      routeLine.setLatLngs([]);


      if (currentMarker !== null) {

        map.removeLayer(
          currentMarker
        );

        currentMarker = null;

      }


      distanceText.textContent =
        "0.00";

      timeText.textContent =
        "0";

      pointsText.textContent =
        "0";


      startButton.textContent =
        "▶ 歩き始める";

      status.textContent =
        "停止中";

    }
  );

</script>

</body>
</html>
