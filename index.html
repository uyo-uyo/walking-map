<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>歩いた土地を塗る</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f6f4;
      color: #222;
    }

    .app {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 5px;
      font-size: 28px;
    }

    .subtitle {
      margin-top: 0;
      color: #666;
    }

    #map {
      width: 100%;
      height: 500px;
      margin-top: 20px;
      border-radius: 18px;
      overflow: hidden;
      border: 2px solid #ddd;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 15px;
    }

    .stat {
      background: white;
      padding: 15px;
      border-radius: 14px;
      text-align: center;
      border: 1px solid #ddd;
    }

    .stat-title {
      color: #777;
      font-size: 13px;
    }

    .stat-value {
      font-size: 22px;
      font-weight: bold;
      margin-top: 5px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #2f8f4e;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #26783f;
    }

    button.reset {
      background: #777;
    }

    .status {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .app {
        padding: 12px;
      }

      h1 {
        font-size: 24px;
      }

      #map {
        height: 450px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .buttons {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <h1>歩いた土地を、塗っていこう。</h1>

  <p class="subtitle">
    あなたの旅の足跡を地図に残そう。
  </p>

  <div id="map"></div>

  <div class="stats">

    <div class="stat">
      <div class="stat-title">歩いた距離</div>
      <div class="stat-value">
        <span id="distance">0.0</span> km
      </div>
    </div>

    <div class="stat">
      <div class="stat-title">歩いた時間</div>
      <div class="stat-value">
        <span id="time">0</span> 分
      </div>
    </div>

    <div class="stat">
      <div class="stat-title">記録</div>
      <div class="stat-value">
        <span id="steps">0</span> m
      </div>
    </div>

  </div>

  <div class="buttons">

    <button id="startButton">
      ▶ 歩き始める
    </button>

    <button id="walkButton">
      ＋ 歩く
    </button>

    <button id="resetButton" class="reset">
      ↺ リセット
    </button>

  </div>

  <div class="status" id="status">
    停止中
  </div>

</div>


<!-- Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

  /*
   * 地図を作成
   *
   * 最初は東京駅付近を表示
   */
  const map = L.map("map").setView(
    [35.681236, 139.767125],
    15
  );


  /*
   * OpenStreetMapの地図を表示
   */
  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors"
    }
  ).addTo(map);


  /*
   * 歩いたルートを表示する線
   */
  const routeLine = L.polyline(
    [],
    {
      color: "#2f8f4e",
      weight: 7,
      opacity: 0.85
    }
  ).addTo(map);


  /*
   * 現在地を表すマーカー
   */
  const currentMarker = L.circleMarker(
    [35.681236, 139.767125],
    {
      radius: 9,
      color: "#ffffff",
      weight: 3,
      fillColor: "#2f8f4e",
      fillOpacity: 1
    }
  ).addTo(map);


  /*
   * 試作用のルート
   *
   * 東京駅周辺を歩いているように見せる
   */
  const testRoute = [

    [35.681236, 139.767125],

    [35.682500, 139.768500],

    [35.683500, 139.770000],

    [35.684500, 139.771500],

    [35.685500, 139.773000],

    [35.686500, 139.774500],

    [35.687500, 139.776000]

  ];


  let walking = false;

  let routeIndex = 0;

  let distance = 0;

  let time = 0;

  let steps = 0;


  const startButton =
    document.getElementById("startButton");

  const walkButton =
    document.getElementById("walkButton");

  const resetButton =
    document.getElementById("resetButton");

  const distanceText =
    document.getElementById("distance");

  const timeText =
    document.getElementById("time");

  const stepsText =
    document.getElementById("steps");

  const status =
    document.getElementById("status");


  /*
   * 歩き始める
   */
  startButton.addEventListener(
    "click",
    function() {

      walking = !walking;

      if (walking) {

        startButton.textContent =
          "Ⅱ 一時停止";

        status.textContent =
          "歩行中";

      } else {

        startButton.textContent =
          "▶ 歩き始める";

        status.textContent =
          "一時停止中";

      }

    }
  );


  /*
   * 「歩く」ボタン
   *
   * 今は試作用。
   * 後でGPSに置き換える。
   */
  walkButton.addEventListener(
    "click",
    function() {

      if (!walking) {

        status.textContent =
          "先に「歩き始める」を押してください";

        return;

      }


      if (
        routeIndex >= testRoute.length
      ) {

        status.textContent =
          "目的地に到着しました！";

        walking = false;

        startButton.textContent =
          "▶ もう一度歩く";

        return;

      }


      const point =
        testRoute[routeIndex];


      routeIndex++;


      /*
       * ルートに現在地を追加
       */
      const currentRoute =
        testRoute.slice(
          0,
          routeIndex
        );


      routeLine.setLatLngs(
        currentRoute
      );


      /*
       * 現在地マーカーを移動
       */
      currentMarker.setLatLng(
        point
      );


      /*
       * 地図を現在地に移動
       */
      map.panTo(point);


      /*
       * 数値を更新
       */
      distance += 0.12;

      time += 1;

      steps += 120;


      distanceText.textContent =
        distance.toFixed(1);

      timeText.textContent =
        time;

      stepsText.textContent =
        steps;


      if (
        routeIndex >= testRoute.length
      ) {

        status.textContent =
          "目的地に到着しました！";

        walking = false;

        startButton.textContent =
          "▶ もう一度歩く";

      }

    }
  );


  /*
   * リセット
   */
  resetButton.addEventListener(
    "click",
    function() {

      walking = false;

      routeIndex = 0;

      distance = 0;

      time = 0;

      steps = 0;


      routeLine.setLatLngs([]);

      currentMarker.setLatLng(
        testRoute[0]
      );


      map.setView(
        [35.681236, 139.767125],
        15
      );


      distanceText.textContent =
        "0.0";

      timeText.textContent =
        "0";

      stepsText.textContent =
        "0";


      startButton.textContent =
        "▶ 歩き始める";

      status.textContent =
        "停止中";

    }
  );

</script>

</body>
</html>
